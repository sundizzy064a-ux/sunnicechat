<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUNNICE - Chat & Voice</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif}header{background:#151515;padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0}.logo{color:#ff3b30;font-weight:900;font-size:22px}.list{padding:12px;max-width:500px;margin:0 auto;padding-bottom:80px}.card{background:#151515;border:1px solid #222;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}.av{width:50px;height:50px;border-radius:50%;background:#ff3b30;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}.gbtn{margin-left:auto;background:#222;color:#ff3b30;border:none;padding:8px 16px;border-radius:20px;font-weight:700}#chatBox{position:fixed;inset:0;background:#0a0a0a;display:none;flex-direction:column;z-index:20}.cHead{padding:12px;background:#151515;display:flex;justify-content:space-between;border-bottom:1px solid #222}.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;word-break:break-word}.me{align-self:flex-end;background:#ff3b30}.them{align-self:flex-start;background:#222}.bar{padding:10px;background:#151515;display:flex;gap:8px;border-top:1px solid #222;align-items:center}.bar input{flex:1;background:#222;border:none;border-radius:20px;padding:12px 14px;color:#fff;outline:none}.bar button{width:44px;height:44px;border-radius:50%;border:none;background:#ff3b30;color:#fff;flex-shrink:0}.box{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.inner{background:#151515;padding:20px;border-radius:16px;width:100%;max-width:340px;border:1px solid #222}.inner input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;box-sizing:border-box}.inner button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;background:#ff3b30;color:#fff;font-weight:800}#recInfo{display:none;text-align:center;background:#330000;color:#ffaaaa;padding:6px;font-size:12px}</style></head><body><header><div class="logo">SUNNICE</div><button onclick="random()" style="background:#ff3b30;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700">Random</button></header><div id="signup" class="box"><div class="inner"><h3 style="text-align:center;margin:0 0 10px 0">Create Account</h3><p style="text-align:center;color:#888;font-size:12px;margin-bottom:10px">Sign up - Meet - Chat - Voice Note</p><input id="n" placeholder="Your Name *"><input id="a" type="number" placeholder="Age"><input id="c" placeholder="City e.g Lagos"><input id="b" placeholder="Bio e.g Love gist"><button onclick="join()">Create Account</button></div></div><div class="list" id="list"></div><div id="chatBox"><div class="cHead"><b id="cname"></b><button onclick="chatBox.style.display='none'" style="background:#222;color:#fff;border:none;width:30px;height:30px;border-radius:50%">X</button></div><div class="msgs" id="msgs"></div><div id="recInfo">Recording... tap Stop to send</div><div class="bar"><button onclick="voice()" id="mic">🎤</button><input id="inp" placeholder="Type message..."><button onclick="send()">➤</button></div></div><script>let people=[{id:1,n:'Ada',a:22,c:'Lagos',b:'Love gist'},{id:2,n:'Tunde',a:24,c:'Sagamu',b:'New here'},{id:3,n:'Chioma',a:21,c:'Abuja',b:'Chat me'},{id:4,n:'David',a:25,c:'PH',b:'Fun guy'},{id:5,n:'Amaka',a:23,c:'Enugu',b:'Ready to gist'},{id:6,n:'Zainab',a:20,c:'Kano',b:'Shy but friendly'}];let saved=JSON.parse(localStorage.getItem('sp')||'[]');saved.forEach(x=>people.push(x));let me=JSON.parse(localStorage.getItem('me')||'null');if(me){signup.style.display='none'}let cur=null,rec=false,mr,chunks=[];function show(){let L=document.getElementById('list');L.innerHTML='';people.forEach(p=>{let d=document.createElement('div');d.className='card';let isMe=me&&p.id==me.id;d.innerHTML=`<div class="av">${p.n[0]}</div><div style="flex:1"><b>${p.n}, ${p.a}</b> - ${p.c}${isMe?' (You)':''}<br><small style="color:#888">${p.b}</small></div><button class="gbtn">${isMe?'You':'Gist'}</button>`;if(!isMe)d.querySelector('.gbtn').onclick=()=>openChat(p.id);L.appendChild(d);});}show();function join(){let name=document.getElementById('n').value.trim();if(!name){alert('Enter name');return}let u={id:Date.now(),n:name,a:document.getElementById('a').value||'??',c:document.getElementById('c').value||'Naija',b:document.getElementById('b').value||'Ready to gist'};people.push(u);saved.push(u);localStorage.setItem('sp',JSON.stringify(saved));localStorage.setItem('me',JSON.stringify(u));me=u;signup.style.display='none';show();}function openChat(id){cur=people.find(x=>x.id==id);cname.innerText=cur.n;chatBox.style.display='flex';load();}function random(){let o=people.filter(x=>!me||x.id!=me.id);openChat(o[Math.floor(Math.random()*o.length)].id);}function load(){let k='chat_'+cur.id;let m=JSON.parse(localStorage.getItem(k)||'[]');msgs.innerHTML='';m.forEach(x=>{let d=document.createElement('div');d.className='msg '+(x.me?'me':'them');if(x.type=='voice'){d.innerHTML=`<audio controls src="${x.t}" style="width:180px"></audio>`}else{d.innerText=x.t}msgs.appendChild(d);});msgs.scrollTop=msgs.scrollHeight;}function send(){let v=inp.value.trim();if(!v)return;let k='chat_'+cur.id;let m=JSON.parse(localStorage.getItem(k)||'[]');m.push({t:v,me:true,type:'text'});localStorage.setItem(k,JSON.stringify(m));inp.value='';load();setTimeout(()=>{let m2=JSON.parse(localStorage.getItem(k)||'[]');m2.push({t:["Lol 😂","I like your vibe!","Send voice note na 🎤","You dey Lagos?"][Math.floor(Math.random()*4)],me:false,type:'text'});localStorage.setItem(k,JSON.stringify(m2));load();},800);}inp.addEventListener('keydown',e=>{if(e.key=='Enter')send()});async function voice(){if(!rec){start()}else{stop()}}async function start(){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mr=new MediaRecorder(s);mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};mr.onstop=()=>{let b=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>{let k='chat_'+cur.id;let m=JSON.parse(localStorage.getItem(k)||'[]');m.push({t:r.result,me:true,type:'voice'});localStorage.setItem(k,JSON.stringify(m));load();};r.readAsDataURL(b);s.getTracks().forEach(t=>t.stop());};mr.start();rec=true;mic.innerText='⏹️';recInfo.style.display='block';}catch(e){alert('Allow microphone to record voice note')}}function stop(){if(mr&&rec){mr.stop();rec=false;mic.innerText='🎤';recInfo.style.display='none'}}</script></body></html>
