<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagos Love - Full Fixed</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#FFF8E1;color:#222}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:#FFFDE7;display:flex;flex-direction:column;position:relative;box-shadow:0 0 20px rgba(0,0,0,.1)}
.top{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #FFD54F;position:sticky;top:0;z-index:10}
.top b{font-size:19px;color:#2E7D32}
.auth{flex:1;padding:18px;background:#FFF8E1;overflow-y:auto}
.card{background:#fff;border:1.5px solid #FFECB3;border-radius:18px;padding:14px;margin:8px 0}
.card input,.card select,.card textarea{width:100%;background:#FFFDE7;border:1.5px solid #FFECB3;padding:11px;border-radius:12px;color:#333;margin:4px 0;font-size:14px;outline:none}
.btn{width:100%;background:#2E7D32;color:#fff;border:none;padding:12px;border-radius:30px;font-weight:900;margin-top:6px}
.btn-yellow{background:#FFD54F;color:#2E7D32;border:2px solid #FFCA28}
.view{flex:1;overflow-y:auto;padding-bottom:85px;background:#FFF8E1}
.userCard{background:#fff;border-radius:18px;margin:10px;overflow:hidden;border:1px solid #FFECB3}
.userCard img{width:100%;height:260px;object-fit:cover;background:#FFF8E1}
.bottomNav{position:absolute;bottom:0;left:0;right:0;background:#2E7D32;display:flex;padding:6px 0 8px;z-index:20}
.bottomNav button{flex:1;background:transparent;border:none;color:rgba(255,255,255,.6);padding:6px;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.bottomNav button.on{color:#FFEB3B}
.chatList{display:flex;gap:10px;padding:10px 12px;align-items:center;background:#fff;margin:5px 10px;border-radius:14px;border:1px solid #FFECB3}
.av{width:48px;height:48px;border-radius:50%;background:#FFF8E1;border:2px solid #FFD54F;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;color:#2E7D32}
.av img{width:100%;height:100%;object-fit:cover}
.chatBox{background:#FFF8E1;flex:1;overflow-y:auto;padding:10px 8px}
.bubble{max-width:76%;padding:9px 13px;border-radius:18px;font-size:14px;margin:4px 0}
.bubble.me{align-self:flex-end;background:#2E7D32;color:#fff;border-bottom-right-radius:6px;margin-left:auto}
.bubble.other{align-self:flex-start;background:#fff;color:#222;border:1px solid #FFECB3;border-bottom-left-radius:6px}
.bubbleWrap{display:flex;flex-direction:column}
.inputbar{position:absolute;bottom:56px;left:0;right:0;background:#fff;padding:7px 10px;display:flex;gap:6px;align-items:center;border-top:1px solid #FFECB3}
.wrap{flex:1;background:#FFF8E1;border-radius:28px;display:flex;align-items:center;padding:3px 6px 3px 12px;border:1.5px solid #FFECB3}
.wrap input{flex:1;background:transparent;border:none;outline:none;padding:7px;font-size:14px}
.sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:#2E7D32;color:#fff;font-weight:900}
.editOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.editBox{background:#fff;border-radius:20px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;border:2px solid #FFD54F}
</style></head><body>
<div class="app">
<div class="top"><b>💛 Lagos Love</b><span id="topInfo" style="font-size:11px;color:#888">Edit Pic Fixed</span></div>
<div id="auth">
<div style="text-align:center;margin-bottom:8px"><h1 style="font-size:26px;color:#2E7D32">Find Love<br><span style="background:#FFD54F;padding:0 8px;border-radius:8px">For Lagos</span></h1><p style="color:#795548;font-size:11px">Lite Yellow • White Top • Green Down • Edit Pic Fixed!</p></div>
<div id="loginBox" class="card">
<b style="font-size:12px;color:#2E7D32">LOGIN</b>
<input id="le" placeholder="Email">
<input id="lp" type="password" placeholder="Password">
<button class="btn" onclick="login()">LOGIN 💛</button>
<p style="text-align:center;font-size:12px;margin-top:8px;color:#666">No account? <span style="color:#2E7D32;font-weight:900;text-decoration:underline" onclick="showSignup()">Sign up</span></p>
</div>
<div id="signupBox" class="card" style="display:none">
<b style="font-size:12px;color:#2E7D32">CREATE ACCOUNT</b>
<input id="sn" placeholder="Full name">
<input id="sage" type="number" placeholder="Age">
<select id="sgender"><option>Man</option><option>Woman</option></select>
<select id="sarea"><option>Lekki</option><option>Ikeja</option><option>Yaba</option><option>Surulere</option><option>VI</option><option>Ajah</option><option>Oshodi</option></select>
<textarea id="sbio" rows="2" placeholder="Bio"></textarea>
<input type="file" id="sfile" accept="image/*">
<input id="se" placeholder="Email">
<input id="sp" type="password" placeholder="Password">
<button class="btn" onclick="signup()">SIGN UP 💚</button>
<p style="text-align:center;font-size:12px;margin-top:8px;color:#666">Already have? <span style="color:#2E7D32;font-weight:900;text-decoration:underline" onclick="showLogin()">Login</span></p>
</div>
</div>
<div id="main" style="display:none;flex:1;flex-direction:column;height:100%;position:relative">
<div id="vDiscover" class="view"><div id="discoverList"></div></div>
<div id="vChats" class="view" style="display:none"><div id="chatList"></div></div>
<div id="vChatBox" class="view" style="display:none;flex-direction:column;height:100%"><div style="background:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #FFECB3"><button onclick="backToChats()" style="background:transparent;border:none;font-size:18px">←</button><div class="av" id="chatAv"></div><div><b id="chatName" style="font-size:13px"></b><div style="font-size:10px;color:#4CAF50">● Online</div></div></div><div class="chatBox" id="ch"></div><div class="inputbar"><div class="wrap"><input id="msg" placeholder="Message..."><button onclick="document.getElementById('file').click()" style="background:transparent;border:none">📷</button></div><button class="sendBtn" onclick="sendMsg()">➤</button><input type="file" id="file" accept="image/*" style="display:none" onchange="sendPic(this)"></div></div>
<div id="vProfile" class="view" style="display:none"><div id="myProfile"></div></div>
<div class="bottomNav">
<button id="bDiscover" class="on" onclick="tab('discover')">💛 DISCOVER</button>
<button id="bChats" onclick="tab('chats')">💬 CHATS</button>
<button id="bProfile" onclick="tab('profile')">👤 PROFILE</button>
</div>
</div>
<div id="editOverlay" class="editOverlay">
<div class="editBox">
<h3 style="color:#2E7D32;text-align:center">✏️ Edit Your Profile</h3>
<p style="font-size:11px;color:#888;text-align:center">Picture change now fixed!</p>
<div style="text-align:center;margin:12px 0">
<div id="editPicPreview" class="av" style="width:90px;height:90px;margin:0 auto;font-size:32px;border:3px solid #FFD54F"></div>
<div style="margin-top:8px">
<label style="background:#FFD54F;color:#2E7D32;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer">
📷 CHANGE PICTURE
<input type="file" id="efile" accept="image/*" style="display:none" onchange="previewEditPic(this)">
</label>
<p style="font-size:10px;color:#999;margin-top:4px">Pick small pic - must show preview!</p>
</div>
</div>
<input id="en" placeholder="Full name">
<input id="eage" type="number" placeholder="Age">
<select id="egender"><option>Man</option><option>Woman</option></select>
<select id="earea"><option>Lekki</option><option>Ikeja</option><option>Yaba</option><option>Surulere</option><option>VI</option><option>Ajah</option><option>Oshodi</option></select>
<textarea id="ebio" rows="3" placeholder="Bio"></textarea>
<input id="epass" type="text" placeholder="Password">
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn" style="flex:1;background:#888" onclick="closeEdit()">CANCEL</button>
<button class="btn" style="flex:1" onclick="saveEdit()">SAVE 💚</button>
</div>
<p id="saveStatus" style="font-size:11px;color:#2E7D32;text-align:center;margin-top:6px"></p>
</div>
</div>
</div>
<script>
const firebaseConfig = {apiKey:"AIzaSyDemo-Replace",authDomain:"lagos-love-demo.firebaseapp.com",databaseURL:"https://lagos-love-demo-default-rtdb.firebaseio.com",projectId:"lagos-love-demo",};
let useFirebase=false;
try{if(!firebaseConfig.apiKey.includes("Demo-Replace")){firebase.initializeApp(firebaseConfig);useFirebase=true;}}catch(e){useFirebase=false;}
let cur=JSON.parse(localStorage.getItem('lagos_cur')||'null');
let users=[],msgs=[],currentChatId=null,newPic=null;
function showSignup(){loginBox.style.display='none';signupBox.style.display='block';}
function showLogin(){signupBox.style.display='none';loginBox.style.display='block';}
function signup(){
let name=sn.value.trim(),age=sage.value,gender=sgender.value,area=sarea.value,bio=sbio.value.trim(),email=se.value.trim().toLowerCase(),pass=sp.value.trim();
if(!name||!email||!pass||!age)return alert('Fill name, age, email, password!');
let file=document.getElementById('sfile').files[0];
let finish=(pic)=>{
let user={id:Date.now().toString(),name:name,age:age,gender:gender,area:area,bio:bio,email:email,pass:pass,pic:pic||'',joined:Date.now()};
if(useFirebase){firebase.database().ref('users/'+user.id).set(user).then(()=>{cur=user;localStorage.setItem('lagos_cur',JSON.stringify(cur));startApp();});}
else{let localUsers=JSON.parse(localStorage.getItem('lagos_real_users')||'[]');if(localUsers.find(u=>u.email===email))return alert('Email exist!');localUsers.push(user);localStorage.setItem('lagos_real_users',JSON.stringify(localUsers));cur=user;localStorage.setItem('lagos_cur',JSON.stringify(cur));startApp();}
};
if(file){let r=new FileReader();r.onload=e=>compressImage(e.target.result,finish);r.readAsDataURL(file);}else finish('');
}
function login(){
let email=le.value.trim().toLowerCase(),pass=lp.value.trim();
if(useFirebase){firebase.database().ref('users').once('value',snap=>{let data=snap.val()||{};let found=Object.values(data).find(u=>u.email===email && u.pass===pass);if(!found)return alert('Wrong email/password!');cur=found;localStorage.setItem('lagos_cur',JSON.stringify(cur));startApp();});}
else{let localUsers=JSON.parse(localStorage.getItem('lagos_real_users')||'[]');let u=localUsers.find(x=>x.email===email && x.pass===pass);if(!u)return alert('Wrong!');cur=u;localStorage.setItem('lagos_cur',JSON.stringify(cur));startApp();}
}
function startApp(){
auth.style.display='none';main.style.display='flex';
topInfo.textContent=cur.name+' • Edit Pic Fixed';
if(useFirebase){
firebase.database().ref('users').on('value',snap=>{let data=snap.val()||{};users=Object.values(data);let me=users.find(u=>u.id===cur.id);if(me){cur=me;localStorage.setItem('lagos_cur',JSON.stringify(cur));}renderDiscover();renderChatList();renderMyProfile();});
firebase.database().ref('messages').on('value',snap=>{let data=snap.val()||{};msgs=Object.values(data).sort((a,b)=>a.ts-b.ts);if(currentChatId)renderMessages();renderChatList();});
}else{
users=JSON.parse(localStorage.getItem('lagos_real_users')||'[]');
msgs=JSON.parse(localStorage.getItem('lagos_real_msgs')||'[]');
renderDiscover();renderChatList();renderMyProfile();
}
}
function tab(t){
['discover','chats','chatBox','profile'].forEach(x=>{let el=document.getElementById('v'+x[0].toUpperCase()+x.slice(1));if(el)el.style.display='none';let b=document.getElementById('b'+x[0].toUpperCase()+x.slice(1));if(b)b.classList.remove('on');});
if(t==='discover')document.getElementById('vDiscover').style.display='block';
if(t==='chats')document.getElementById('vChats').style.display='block';
if(t==='chatBox'){document.getElementById('vChatBox').style.display='flex';document.getElementById('vChatBox').style.flexDirection='column';}
if(t==='profile')document.getElementById('vProfile').style.display='block';
let btn=document.getElementById('b'+t[0].toUpperCase()+t.slice(1));if(btn)btn.classList.add('on');
}
function renderDiscover(){
let others=users.filter(u=>u.id!==cur.id);
if(others.length===0){discoverList.innerHTML='<div style="text-align:center;padding:30px 16px"><h3 style="color:#2E7D32">Na only you for now! 😭</h3><p style="font-size:12px;color:#795548;margin-top:8px">Because na REAL PEOPLE ONLY, you be first! Share link make real people sign up!</p><div style="margin-top:12px;background:#fff;padding:10px;border-radius:12px;border:1px solid #FFECB3"><p style="font-size:10px;color:#2E7D32;word-break:break-all">'+location.href+'</p><button class="btn" style="padding:8px;margin-top:6px" onclick="navigator.clipboard.writeText(location.href);alert(\'Link copied!\')">COPY LINK 🔗</button></div></div>';return;}
discoverList.innerHTML=others.map(u=>`<div class="userCard"><img src="${u.pic||'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400'}"><div style="padding:10px 12px"><h3>${u.name}, ${u.age} <span style="color:#4CAF50;font-size:11px">● Online</span></h3><p style="font-size:12px;color:#666">📍 ${u.area} • ${u.gender}</p><p style="font-size:12px;color:#444;margin-top:4px">${u.bio||''}</p><div style="display:flex;gap:6px;margin-top:8px"><button class="btn-yellow btn" style="flex:1;padding:9px;font-size:12px" onclick="startChat('${u.id}')">💬 Message ${u.name.split(' ')[0]}</button></div></div></div>`).join('');
}
function startChat(uid){let u=users.find(x=>x.id===uid);if(!u)return;currentChatId=uid;document.getElementById('chatName').textContent=u.name;document.getElementById('chatAv').innerHTML=u.pic?`<img src="${u.pic}">`:u.name.charAt(0);tab('chatBox');renderMessages();}
function backToChats(){tab('chats');renderChatList();}
function renderChatList(){
let others=users.filter(u=>u.id!==cur.id);
let lastMsgs={};msgs.forEach(m=>{if(m.from===cur.id||m.to===cur.id){let other=m.from===cur.id?m.to:m.from;lastMsgs[other]=m;}});
if(others.length===0){chatList.innerHTML='<p style="text-align:center;color:#999;padding:20px;font-size:12px">No chats yet.</p>';return;}
chatList.innerHTML=others.map(u=>{let last=lastMsgs[u.id];return `<div class="chatList" onclick="startChat('${u.id}')"><div class="av">${u.pic?`<img src="${u.pic}">`:u.name.charAt(0)}</div><div style="flex:1"><b style="font-size:13px">${u.name}</b><div style="font-size:11px;color:#888">${last? (last.text||'📷 Photo') : 'Say Hi!'} • ${last? last.time : ''}</div></div></div>`;}).join('');
}
function renderMessages(){
if(!currentChatId)return;
let conv=msgs.filter(m=>(m.from===cur.id && m.to===currentChatId) || (m.from===currentChatId && m.to===cur.id));
let h='';conv.forEach(m=>{let me=m.from===cur.id;let pic=m.pic?`<img src="${m.pic}" style="width:100%;border-radius:10px;margin-top:4px;max-height:180px;object-fit:cover">`:'';h+=`<div class="bubbleWrap"><div class="bubble ${me?'me':'other'}">${m.text||''}${pic}<div style="font-size:9px;opacity:.6;text-align:right;margin-top:2px">${m.time||''} ${me?'✓✓':''}</div></div></div>`;});
document.getElementById('ch').innerHTML=h||'<p style="text-align:center;color:#BCAAA4;font-size:11px;margin-top:20px">No messages yet. Say Hi! 💛</p>';
document.getElementById('ch').scrollTop=99999;
}
function sendMsg(){
let t=msg.value.trim();if(!t||!currentChatId)return;msg.value='';
let m={from:cur.id,to:currentChatId,text:t,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),ts:Date.now(),id:Date.now().toString()};
if(useFirebase){firebase.database().ref('messages/'+m.id).set(m);}else{msgs.push(m);localStorage.setItem('lagos_real_msgs',JSON.stringify(msgs));renderMessages();renderChatList();}
}
function sendPic(i){
let f=i.files[0];if(!f||!currentChatId)return;let r=new FileReader();r.onload=e=>{
compressImage(e.target.result,(compressed)=>{
let m={from:cur.id,to:currentChatId,text:'',pic:compressed,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),ts:Date.now(),id:Date.now().toString()};
if(useFirebase){firebase.database().ref('messages/'+m.id).set(m);}else{msgs.push(m);localStorage.setItem('lagos_real_msgs',JSON.stringify(msgs));renderMessages();}
});
};r.readAsDataURL(f);
}
function renderMyProfile(){
if(!cur)return;
document.getElementById('myProfile').innerHTML=`
<div style="background:#fff;padding:18px;text-align:center;border-bottom:1px solid #FFECB3">
<div class="av" style="width:86px;height:86px;margin:0 auto;font-size:32px;border:3px solid #FFD54F">${cur.pic?`<img src="${cur.pic}">`:cur.name.charAt(0)}</div>
<h2 style="margin-top:8px;color:#222">${cur.name}, ${cur.age}</h2>
<p style="color:#2E7D32;font-size:12px">📍 ${cur.area} • ${cur.gender} • Real</p>
<p style="font-size:12px;color:#666;margin-top:4px">${cur.bio||''}</p>
<button class="btn-yellow btn" style="margin-top:10px;padding:10px" onclick="openEdit()">✏️ EDIT PROFILE + CHANGE PICTURE!</button>
</div>
<div style="padding:12px">
<div class="card" style="text-align:center;border:2px dashed #FFD54F">
<b style="color:#2E7D32;font-size:12px">INVITE REAL PEOPLE</b>
<p style="font-size:10px;color:#2E7D32;word-break:break-all;background:#FFF8E1;padding:6px;border-radius:8px;margin-top:6px">${location.href}</p>
<button class="btn-yellow btn" onclick="navigator.clipboard.writeText(location.href);alert('Link copied!')">COPY LINK 🔗</button>
