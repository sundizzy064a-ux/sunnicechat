<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sunnicechat.com</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#111b21;color:#e9edef;min-height:100vh}.auth{max-width:420px;margin:0 auto;min-height:100vh;background:#111b21;display:flex;flex-direction:column;justify-content:center;padding:24px}.auth h1{text-align:center;font-size:28px}.auth .sub{color:#8696a0;text-align:center;margin:8px 0 20px}.auth input{width:100%;background:#2a3942;border:none;padding:15px;border-radius:8px;color:#fff;margin:8px 0;font-size:16px}.btn{width:100%;background:#00a884;color:#111b21;border:none;padding:15px;border-radius:25px;font-weight:bold;font-size:16px;margin-top:12px}.btn2{width:100%;background:#202c33;color:#00a884;border:1px solid #00a884;padding:13px;border-radius:25px;font-weight:bold;font-size:15px;margin-top:12px}.wa{max-width:480px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#0b141a;position:relative}.head{background:#202c33;padding:10px 14px;display:flex;align-items:center;gap:10px;height:60px}.av{width:40px;height:40px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}.chat{flex:1;overflow-y:auto;padding:10px 8px 80px 8px;background:#0b141a}.b{max-width:75%;padding:7px 10px;border-radius:8px;margin:4px 8px;font-size:14.5px}.b.other{background:#202c33}.b.me{background:#005c4b;margin-left:auto}.t{font-size:11px;color:#8696a0;float:right;margin:5px 0 0 8px}.inputbar{position:absolute;bottom:0;left:0;right:0;background:#202c33;padding:6px 10px;display:flex;gap:8px}.wrap{flex:1;background:#2a3942;border-radius:21px;display:flex;padding:4px 12px}.wrap input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:8px}.inputbar button{background:#00a884;width:45px;height:45px;border-radius:50%;border:none;color:#fff}</style></head><body><div id="auth" class="auth"><h1>sunnicechat.com 💬</h1><p class="sub">Real WhatsApp Style - Tap to start</p><input id="sn" placeholder="Your name (e.g Sunnice)"><input id="se" type="email" placeholder="Email (e.g sunnice@gmail.com)"><input id="sp" type="password" placeholder="Password (any 6 letters)"><button class="btn" onclick="signup()">🔥 CREATE ACCOUNT & ENTER CHAT</button><button class="btn2" onclick="login2()">Already have? LOGIN</button><p style="margin-top:20px;font-size:12px;opacity:.4;text-align:center">Just type name,email,pass and press green button - you go enter WhatsApp chat!</p></div><div id="app" class="wa" style="display:none"><div class="head"><div class="av" id="av">S</div><div style="flex:1"><b>sunnicechat.com 💬</b><div id="on" style="font-size:13px;color:#8696a0">online</div></div></div><div class="chat" id="ch"></div><div class="inputbar"><div class="wrap"><input id="msg" placeholder="Type a message"><span>😊</span></div><button onclick="send()">➤</button></div></div><script>let cur=null,curName='',msgs=JSON.parse(localStorage.getItem('sc_m')||'[]');window.signup=()=>{let n=document.getElementById('sn').value.trim(),e=document.getElementById('se').value.trim(),p=document.getElementById('sp').value.trim();if(!n||!e||p.length<3)return alert('Please fill Name, Email and Password (min 3)');localStorage.setItem('sc_n',n);curName=n;cur={uid:Date.now()+''};enter();render();};window.login2=()=>{let n=sn.value.trim()||'Guest';let e=se.value.trim()||'guest@mail.com';if(!n)return alert('Put name');localStorage.setItem('sc_n',n);curName=n;cur={uid:Date.now()+''};enter();render();};function enter(){auth.style.display='none';app.style.display='flex';av.textContent=curName.charAt(0).toUpperCase();on.textContent=curName+' • online';}
window.send=()=>{let t=msg.value.trim();if(!t||!cur)return;msg.value='';let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});msgs.push({uid:cur.uid,name:curName,text:t,tm:tm});localStorage.setItem('sc_m',JSON.stringify(msgs));render();setTimeout(()=>{if(Math.random()>0.5){let ns=['Amaka','Tunde'],tx=['You welcome! 😂','This chat sweet 🔥','How far na?'];let f={uid:'o'+Math.random(),name:ns[Math.floor(Math.random()*ns.length)],text:tx[Math.floor(Math.random()*tx.length)],tm:tm};msgs.push(f);localStorage.setItem('sc_m',JSON.stringify(msgs));render();}},1000);};
function render(){ch.innerHTML='';msgs.slice(-100).forEach(m=>{let me=m.uid===cur.uid;ch.innerHTML+=`<div class="b ${me?'me':'other'}">${!me?`<b style="color:#53bdeb;font-size:12px">${m.name}</b><br>`:''}${m.text}<span class="t">${m.tm} ${me?'✓✓':''}</span><div style="clear:both"></div></div>`});ch.scrollTop=ch.scrollHeight;}
msg?.addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script></body></html>
