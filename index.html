<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagos Life - Legit Danfo</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#000;color:#fff}
.danfo{max-width:440px;margin:0 auto;min-height:100vh;background:#0f0f0f;display:flex;flex-direction:column;position:relative}
.roof{background:repeating-linear-gradient(90deg,#FFD700 0 20px,#000 20px 40px);height:12px}
.top{background:#111;padding:8px 12px;display:flex;justify-content:space-between;font-size:11px;color:#FFD700;font-weight:900;border-bottom:2px solid #FFD700}
.auth{flex:1;padding:18px;overflow-y:auto;background:#000}
.card{background:#151515;border:2px solid #FFD700;border-radius:14px;padding:14px;margin:10px 0}
.card input,.card select{width:100%;background:#000;border:1px solid #333;padding:11px;border-radius:10px;color:#fff;margin:5px 0}
.btn{width:100%;background:#FFD700;color:#000;border:none;padding:12px;border-radius:30px;font-weight:900;margin-top:8px}
.bubble{max-width:78%;padding:8px 11px;border-radius:16px;margin:5px 8px;font-size:13.5px;border:1px solid #222}
.bubble.other{background:#1e1e1e}.bubble.me{background:#FFD700;color:#000;margin-left:auto}
.view{flex:1;overflow-y:auto;padding-bottom:90px}
.pass{display:flex;gap:10px;padding:10px;border-bottom:1px solid #151515;align-items:center}
.av{width:44px;height:44px;background:#FFD700;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;background:#000;border-top:2px solid #FFD700}
.tabs button{flex:1;background:transparent;border:none;color:#666;padding:10px;font-size:10px;font-weight:900}
.tabs button.on{color:#FFD700;background:#111}
.inputbar{position:absolute;bottom:44px;left:0;right:0;background:#111;padding:6px 8px;display:flex;gap:6px;border-top:1px solid #222}
.wrap{flex:1;background:#000;border-radius:24px;display:flex;padding:3px 10px;border:1px solid #333}
.wrap input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:8px}
.send{background:#FFD700;width:42px;height:42px;border-radius:50%;border:none;font-weight:900}
.invite{background:#000;border:2px dashed #FFD700;padding:12px;border-radius:12px;text-align:center;margin:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head><body>
<div class="danfo">
<div class="roof"></div>
<div class="top"><span>🚌 CMS → OSHODI • <span id="online">1</span> for danfo</span><span id="clock">9:41</span><span>₦<span id="bal">1500</span></span></div>

<div id="auth">
<h1 style="text-align:center;font-size:28px">REAL<br><span style="background:#FFD700;color:#000;padding:0 8px">LAGOS LIFE</span></h1>
<p style="text-align:center;color:#777;font-size:11px;margin:6px 0">Legit Danfo • Add Real People • No Form!</p>
<div class="card">
<input id="sn" placeholder="Street name">
<select id="area"><option>Lekki</option><option>Ikeja</option><option>Yaba</option><option>Oshodi</option><option>Ajegunle</option><option>Mushin</option></select>
<input id="se" placeholder="Email">
<input id="sp" type="password" placeholder="Password">
<button class="btn" onclick="join()">JOIN DANFO - OWA! 🚕</button>
</div>
<div class="invite"><b>🔗 ADD REAL PEOPLE?</b><p style="font-size:11px;color:#888;margin:6px 0">After you join, share your link make friends join same danfo from their phone!</p></div>
</div>

<div id="app" style="display:none;flex:1;flex-direction:column;position:relative;height:100vh">
<div style="background:#000;padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid #222">
<button onclick="addPeople()" style="flex:1;background:#FFD700;color:#000;border:none;padding:8px;border-radius:20px;font-weight:900;font-size:11px">+ ADD PEOPLE 🔗</button>
<button onclick="shareDanfo()" style="flex:1;background:#222;color:#FFD700;border:1px solid #FFD700;padding:8px;border-radius:20px;font-weight:900;font-size:11px">SHARE DANFO LINK</button>
</div>

<div id="vChat" class="view"><div id="ch"></div></div>
<div id="vFriends" class="view" style="display:none"><div id="flist"></div><div class="invite"><p style="font-size:11px">Invite link:</p><p id="inviteLink" style="font-size:10px;color:#FFD700;word-break:break-all"></p><button class="btn" onclick="copyLink()" style="padding:8px;font-size:11px">COPY LINK</button></div></div>
<div id="vProfile" class="view" style="display:none"><div id="myProfile"></div></div>

<div class="inputbar">
<div class="wrap"><input id="msg" placeholder="How far? Yarn..."><button onclick="document.getElementById('file').click()" style="background:transparent;border:none">📷</button></div>
<button class="send" onclick="send()">➤</button>
<input type="file" id="file" accept="image/*" style="display:none" onchange="sendPic(this)">
</div>
<div class="tabs">
<button id="tChat" class="on" onclick="tab('chat')">DANFO CHAT</button>
<button id="tFriends" onclick="tab('friends')">PASSENGERS (<span id="pCount">1</span>)</button>
<button id="tProfile" onclick="tab('profile')">MY PROFILE</button>
</div>
</div>
</div>

<script>
// === PUT YOUR FIREBASE CONFIG HERE AFTER YOU CREATE ===
const firebaseConfig = {
  apiKey: "REPLACE",
  authDomain: "lagos-life-xxx.firebaseapp.com",
  databaseURL: "https://lagos-life-xxx-default-rtdb.firebaseio.com",
  projectId: "lagos-life-xxx",
  appId: "1:xxx"
};
// If you no put config yet, e go use local mode (you alone)
// After you put config, real people go fit join!

let useFirebase = false;
try{ if(firebaseConfig.apiKey!=="REPLACE"){firebase.initializeApp(firebaseConfig);useFirebase=true;} }catch(e){}

let curName='',curArea='',prof={},msgs=[],users={},myId='user_'+Date.now();
let balance=1500;
let danfoId = new URLSearchParams(location.search).get('danfo') || 'main-danfo-cms-oshodi';

function join(){
let n=sn.value.trim(),a=area.value;if(!n)return alert('Put name');curName=n;curArea=a;prof={name:n,area:a,id:myId,joined:Date.now()};
localStorage.setItem('lagos_real',JSON.stringify(prof));
auth.style.display='none';app.style.display='flex';
if(useFirebase){
firebase.database().ref('danfos/'+danfoId+'/users/'+myId).set(prof);
firebase.database().ref('danfos/'+danfoId+'/users/'+myId).onDisconnect().remove();
firebase.database().ref('danfos/'+danfoId+'/messages').limitToLast(100).on('child_added',snap=>{
let m=snap.val();msgs.push(m);renderChat();
});
firebase.database().ref('danfos/'+danfoId+'/users').on('value',snap=>{
users=snap.val()||{};document.getElementById('online').textContent=Object.keys(users).length;
document.getElementById('pCount').textContent=Object.keys(users).length;
renderFriends();
});
}else{
msgs=[{name:'CONDUCTOR',text:'Owa owa! You enter danfo! To add REAL people, you need Firebase config - check code comment!',sys:true}];
renderChat();renderFriends();
}
renderProfile();
updateInvite();
}
function send(){
let t=msg.value.trim();if(!t)return;msg.value='';
let m={name:curName,area:curArea,text:t,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),id:myId};
if(useFirebase){firebase.database().ref('danfos/'+danfoId+'/messages').push(m);}else{msgs.push(m);renderChat();}
}
function sendPic(i){
let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{
let m={name:curName,area:curArea,text:'📷 See Lagos!',pic:e.target.result,time:'now',id:myId};
if(useFirebase)firebase.database().ref('danfos/'+danfoId+'/messages').push(m);else{msgs.push(m);renderChat();}
};r.readAsDataURL(f);
}
function tab(t){['chat','friends','profile'].forEach(x=>{document.getElementById('v'+x[0].toUpperCase()+x.slice(1)).style.display='none';document.getElementById('t'+x[0].toUpperCase()+x.slice(1)).classList.remove('on');});document.getElementById('v'+t[0].toUpperCase()+t.slice(1)).style.display='block';document.getElementById('t'+t[0].toUpperCase()+t.slice(1)).classList.add('on');}
function renderChat(){let h='';(msgs.slice(-100)).forEach(m=>{if(m.sys){h+=`<div style="text-align:center;margin:6px"><span style="background:#FFD700;color:#000;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:900">${m.text}</span></div>`;return;}let me=m.id===myId;let pic=m.pic?`<br><img src="${m.pic}" style="width:100%;border-radius:10px;max-height:180px;object-fit:cover;margin-top:5px">`:'';h+=`<div class="bubble ${me?'me':'other'}"><b style="font-size:9px;opacity:.6">${m.name} - ${m.area||''}</b><br>${m.text}${pic}<div style="font-size:9px;opacity:.5;text-align:right">${m.time||''}</div></div>`});document.getElementById('ch').innerHTML=h;document.getElementById('ch').scrollTop=99999;}
function renderFriends(){let list=Object.values(users);if(!useFirebase)list=[prof];document.getElementById('flist').innerHTML=list.map(u=>`<div class="pass"><div class="av">${u.name?.charAt(0)||'L'}</div><div style="flex:1"><b>${u.name}</b> <span style="background:#FFD700;color:#000;font-size:9px;padding:1px 5px;border-radius:10px">${u.area||''}</span><div style="font-size:11px;color:#888">Inside danfo now</div></div><div style="width:8px;height:8px;background:#0f0;border-radius:50%"></div></div>`).join('');}
function renderProfile(){let p=prof;document.getElementById('myProfile').innerHTML=`<div class="card" style="text-align:center"><div class="av" style="width:70px;height:70px;margin:0 auto;font-size:28px">${p.name?.charAt(0)||'L'}</div><h3>${p.name}</h3><p style="color:#FFD700;font-size:12px">${p.area} • ₦${balance}</p></div><div class="card"><b style="font-size:11px;color:#FFD700">SHARE DANFO</b><p style="font-size:11px;color:#888">Send this link to friends make dem join your danfo:</p><p id="link2" style="font-size:10px;color:#FFD700;word-break:break-all;margin:6px 0"></p><button class="btn" onclick="copyLink()">COPY INVITE LINK 🔗</button></div>`;updateInvite();}
function updateInvite(){let link=location.origin+location.pathname+'?danfo='+danfoId;let el=document.getElementById('inviteLink');if(el)el.textContent=link;let el2=document.getElementById('link2');if(el2)el2.textContent=link;}
function addPeople(){tab('friends');updateInvite();alert('Share your danfo link to add people! Anyone with link go enter same danfo!');}
function shareDanfo(){let link=location.origin+location.pathname+'?danfo='+danfoId;if(navigator.share){navigator.share({title:'Join my Lagos Danfo!',url:link});}else{copyLink();}}
function copyLink(){let link=location.origin+location.pathname+'?danfo='+danfoId;navigator.clipboard.writeText(link);alert('Link copied! Send am for WhatsApp make friends join! 🚌 Link: '+link);}
msg?.addEventListener('keypress',e=>{if(e.key==='Enter')send()});
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);
let saved=localStorage.getItem('lagos_real');if(saved){prof=JSON.parse(saved);sn.value=prof.name;area.value=prof.area;}
</script></body></html>
