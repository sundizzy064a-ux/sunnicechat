<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lagos Love - Real People Only</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#FFF8E1;color:#222}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:#FFFDE7;display:flex;flex-direction:column;position:relative;box-shadow:0 0 20px rgba(0,0,0,.1)}
.top{background:#FFFFFF;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #FFE082;position:sticky;top:0;z-index:10}
.top b{font-size:20px;color:#2E7D32;font-weight:900}.top span{font-size:12px;color:#888}
.auth{flex:1;padding:20px;background:#FFF8E1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.card{background:#FFFFFF;border:1.5px solid #FFECB3;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 10px rgba(255,193,7,.15)}
.card input,.card select,.card textarea{width:100%;background:#FFFDE7;border:1.5px solid #FFECB3;padding:12px;border-radius:12px;color:#333;margin:5px 0;font-size:14px;outline:none}
.card input:focus{border-color:#FFD54F}
.btn{width:100%;background:#2E7D32;color:#fff;border:none;padding:13px;border-radius:30px;font-weight:900;margin-top:8px;font-size:14px;letter-spacing:.3px}
.btn-yellow{background:#FFD54F;color:#2E7D32;border:2px solid #FFCA28}
.view{flex:1;overflow-y:auto;padding-bottom:85px;background:#FFF8E1}
.userCard{background:#fff;border-radius:20px;margin:12px;padding:0;overflow:hidden;border:1px solid #FFECB3;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.userCard img{width:100%;height:280px;object-fit:cover;background:#FFF8E1}
.userInfo{padding:12px 14px}
.userInfo h3{font-size:18px;color:#222}.userInfo p{font-size:12px;color:#666;margin:3px 0}
.badge{display:inline-block;background:#FFF8E1;border:1px solid #FFECB3;padding:4px 9px;border-radius:20px;font-size:10px;margin:2px;color:#795548}
.bottomNav{position:absolute;bottom:0;left:0;right:0;background:#2E7D32;display:flex;padding:6px 0 8px;border-top:1px solid #1B5E20;z-index:20}
.bottomNav button{flex:1;background:transparent;border:none;color:rgba(255,255,255,.6);padding:6px;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottomNav button.on{color:#FFEB3B}.bottomNav button i{font-size:20px;font-style:normal}
.chatList{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #FFF3C4;align-items:center;background:#fff;margin:6px 10px;border-radius:14px;border:1px solid #FFECB3}
.chatList .av{width:52px;height:52px;border-radius:50%;background:#FFF8E1;border:2px solid #FFD54F;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;overflow:hidden;color:#2E7D32}
.chatList .av img{width:100%;height:100%;object-fit:cover}
.chatBox{background:#FFF8E1;flex:1;overflow-y:auto;padding:12px 8px;padding-bottom:20px}
.bubbleWrap{display:flex;flex-direction:column;margin:6px 0}
.bubble{max-width:76%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.35;box-shadow:0 1px 2px rgba(0,0,0,.08);position:relative}
.bubble.me{align-self:flex-end;background:#2E7D32;color:#fff;border-bottom-right-radius:6px}
.bubble.other{align-self:flex-start;background:#FFFFFF;color:#222;border:1px solid #FFECB3;border-bottom-left-radius:6px}
.bubble .time{font-size:9px;opacity:.6;margin-top:4px;text-align:right}
.bubble img{width:100%;border-radius:10px;margin-top:6px;max-height:200px;object-fit:cover}
.inputbar{position:absolute;bottom:58px;left:0;right:0;background:#FFFFFF;padding:8px 10px;display:flex;gap:8px;align-items:center;border-top:1px solid #FFECB3}
.wrap{flex:1;background:#FFF8E1;border-radius:28px;display:flex;align-items:center;padding:4px 6px 4px 14px;border:1.5px solid #FFECB3}
.wrap input{flex:1;background:transparent;border:none;outline:none;padding:8px;font-size:14px;color:#333}
.iconBtn{width:36px;height:36px;border-radius:50%;border:none;background:#fff;border:1px solid #FFECB3;display:flex;align-items:center;justify-content:center;font-size:16px}
.sendBtn{width:44px;height:44px;border-radius:50%;border:none;background:#2E7D32;color:#fff;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center}
.profileHead{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #FFECB3}
.profilePic{width:96px;height:96px;border-radius:50%;margin:0 auto;background:#FFF8E1;border:3px solid #FFD54F;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;overflow:hidden;color:#2E7D32}
.profilePic img{width:100%;height:100%;object-fit:cover}
.dot{width:10px;height:10px;background:#4CAF50;border-radius:50%;display:inline-block;margin-right:4px;border:2px solid #fff;box-shadow:0 0 0 1px #4CAF50}
</style></head><body>
<div class="app">
<div class="top"><b>💛 Lagos Love</b><span id="topInfo">Real People Only</span></div>

<div id="auth">
<div style="text-align:center;margin-bottom:10px"><h1 style="font-size:28px;color:#2E7D32">Find Love<br><span style="background:#FFD54F;padding:0 8px;border-radius:8px">For Lagos</span></h1><p style="color:#795548;font-size:12px;margin-top:6px">Lite Yellow • White Top • Green Down • No Robot!</p></div>

<div id="loginBox" class="card">
<b style="font-size:13px;color:#2E7D32">LOGIN</b>
<input id="le" placeholder="Email">
<input id="lp" type="password" placeholder="Password">
<button class="btn" onclick="login()">LOGIN 💛</button>
<p style="text-align:center;font-size:12px;margin-top:10px;color:#666">No account? <span style="color:#2E7D32;font-weight:900;text-decoration:underline" onclick="showSignup()">Sign up</span></p>
</div>

<div id="signupBox" class="card" style="display:none">
<b style="font-size:13px;color:#2E7D32">CREATE YOUR REAL ACCOUNT</b>
<input id="sn" placeholder="Full name - e.g Sunnice">
<input id="sage" type="number" placeholder="Age - e.g 23">
<select id="sgender"><option value="">Gender</option><option>Man</option><option>Woman</option></select>
<select id="sarea"><option>Lekki</option><option>Ikeja</option><option>Yaba</option><option>Surulere</option><option>VI</option><option>Ajah</option><option>Oshodi</option><option>Ikorodu</option><option>Computer Village</option></select>
<textarea id="sbio" rows="2" placeholder="Bio - e.g I be fine boy from Ikeja..."></textarea>
<input type="file" id="sfile" accept="image/*">
<input id="se" placeholder="Email">
<input id="sp" type="password" placeholder="Password">
<button class="btn" onclick="signup()">SIGN UP & FIND LOVE 💚</button>
<p style="text-align:center;font-size:12px;margin-top:10px;color:#666">Already have? <span style="color:#2E7D32;font-weight:900;text-decoration:underline" onclick="showLogin()">Login</span></p>
</div>
<p style="text-align:center;color:#BCAAA4;font-size:10px;margin-top:8px">Anonymous builder - Nobody know na you build am 🕶️</p>
</div>

<div id="main" style="display:none;flex:1;flex-direction:column;height:100%;position:relative">
<div id="vDiscover" class="view"><div id="discoverList"></div></div>
<div id="vChats" class="view" style="display:none"><div id="chatList"></div></div>
<div id="vChatBox" class="view" style="display:none;flex-direction:column;height:100%"><div style="background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #FFECB3"><button onclick="backToChats()" style="background:transparent;border:none;font-size:18px">←</button><div class="av" id="chatAv" style="width:36px;height:36px;border-radius:50%;background:#FFF8E1;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden"></div><div><b id="chatName" style="font-size:14px"></b><div style="font-size:10px;color:#4CAF50"><span class="dot"></span>Online now</div></div></div><div class="chatBox" id="ch"></div><div class="inputbar"><button class="iconBtn" onclick="document.getElementById('file').click()">📷</button><div class="wrap"><input id="msg" placeholder="Message..."><button class="iconBtn" style="border:none;background:transparent" onclick="document.getElementById('file').click()">😊</button></div><button class="sendBtn" onclick="sendMsg()">➤</button><input type="file" id="file" accept="image/*" style="display:none" onchange="sendPic(this)"></div></div>
<div id="vProfile" class="view" style="display:none"><div id="myProfile"></div></div>

<div class="bottomNav">
<button id="bDiscover" class="on" onclick="tab('discover')"><i>💛</i>DISCOVER</button>
<button id="bChats" onclick="tab('chats')"><i>💬</i>CHATS</button>
<button id="bProfile" onclick="tab('profile')"><i>👤</i>PROFILE</button>
</div>
</div>
</div>

<script>
let users=JSON.parse(localStorage.getItem('lagos_real_users')||'[]');
let msgs=JSON.parse(localStorage.getItem('lagos_real_msgs')||'[]');
let cur=JSON.parse(localStorage.getItem('lagos_cur')||'null');

function showSignup(){loginBox.style.display='none';signupBox.style.display='block';}
function showLogin(){signupBox.style.display='none';loginBox.style.display='block';}

function signup(){
let name=sn.value.trim(),age=sage.value,gender=sgender.value,area=sarea.value,bio=sbio.value.trim(),email=se.value.trim().toLowerCase(),pass=sp.value.trim();
if(!name||!email||!pass||!age)return alert('Fill name, age, email, password!');
if(users.find(u=>u.email===email))return alert('Email don exist! Login');
let file=document.getElementById('sfile').files[0];
let finish=(pic)=>{
let user={id:Date.now().toString(),name:name,age:age,gender:gender,area:area,bio:bio,email:email,pass:pass,pic:pic||'',joined:Date.now()};
users.push(user);localStorage.setItem('lagos_real_users',JSON.stringify(users));
cur=user;localStorage.setItem('lagos_cur',JSON.stringify(cur));
startApp();
};
if(file){let r=new FileReader();r.onload=e=>finish(e.target.result);r.readAsDataURL(file);}else finish('');
}
function login(){
let email=le.value.trim().toLowerCase(),pass=lp.value.trim();
let u=users.find(x=>x.email===email && x.pass===pass);
if(!u)return alert('Wrong email or password!');
cur=u;localStorage.setItem('lagos_cur',JSON.stringify(cur));startApp();
}
function startApp(){
auth.style.display='none';main.style.display='flex';
topInfo.textContent=cur.name+' • '+cur.area;
renderDiscover();renderChatList();renderMyProfile();
}
function tab(t){
['discover','chats','chatBox','profile'].forEach(x=>{let el=document.getElementById('v'+x[0].toUpperCase()+x.slice(1));if(el)el.style.display='none';let b=document.getElementById('b'+x[0].toUpperCase()+x.slice(1));if(b)b.classList.remove('on');});
if(t==='discover')document.getElementById('vDiscover').style.display='block';
if(t==='chats')document.getElementById('vChats').style.display='block';
if(t==='chatBox'){document.getElementById('vChatBox').style.display='flex';document.getElementById('vChatBox').style.flexDirection='column';}
if(t==='profile')document.getElementById('vProfile').style.display='block';
let btn=document.getElementById('b'+t[0].toUpperCase()+t.slice(1));if(btn)btn.classList.add('on');
}

function renderDiscover(){
let others=users.filter(u=>u.id!==cur.id);
if(others.length===0){discoverList.innerHTML='<div style="text-align:center;padding:40px 20px"><h3 style="color:#2E7D32">No people yet! 😭</h3><p style="font-size:12px;color:#795548;margin-top:8px">Invite friends make dem sign up! Na real people wey sign up go show here - No robot!</p><div style="margin-top:14px;background:#fff;padding:12px;border-radius:14px;border:1px solid #FFECB3"><p style="font-size:11px;color:#888">Share this link:</p><p style="font-size:11px;color:#2E7D32;word-break:break-all">'+location.href+'</p><button class="btn" style="padding:8px;margin-top:8px" onclick="navigator.clipboard.writeText(location.href);alert(\'Link copied! Send for WhatsApp make friends sign up!\')">COPY LINK 🔗</button></div></div>';return;}
discoverList.innerHTML=others.map(u=>`
<div class="userCard">
<img src="${u.pic||'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400'}" onerror="this.src='https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400'">
<div class="userInfo">
<h3>${u.name}, ${u.age} <span style="color:#4CAF50;font-size:12px">● Online</span></h3>
<p>📍 ${u.area} • ${u.gender||''} • Joined now</p>
<p style="margin-top:6px;color:#444">${u.bio||'No bio yet'}</p>
<div style="margin-top:8px"><span class="badge">💛 Real</span><span class="badge">📍 ${u.area}</span><span class="badge">✅ Verified by signup</span></div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn-yellow btn" style="flex:1;padding:10px" onclick="startChat('${u.id}')">💬 Message ${u.name.split(' ')[0]}</button>
<button class="btn" style="flex:0.4;padding:10px" onclick="viewProfile('${u.id}')">👀 View</button>
</div>
</div>
</div>
`).join('');
}

let currentChatId=null;
function startChat(uid){
let u=users.find(x=>x.id===uid);if(!u)return;
currentChatId=uid;
document.getElementById('chatName').textContent=u.name;
document.getElementById('chatAv').innerHTML=u.pic?`<img src="${u.pic}" style="width:100%;height:100%;object-fit:cover">`:u.name.charAt(0);
tab('chatBox');renderMessages();
}
function viewProfile(uid){startChat(uid);}

function renderChatList(){
let others=users.filter(u=>u.id!==cur.id);
let lastMsgs={};
msgs.forEach(m=>{
if(m.from===cur.id || m.to===cur.id){
let otherId=m.from===cur.id?m.to:m.from;
lastMsgs[otherId]=m;
}
});
if(others.length===0){chatList.innerHTML='<p style="text-align:center;color:#999;padding:30px;font-size:12px">No chats yet. Go Discover and message someone real!</p>';return;}
chatList.innerHTML=others.map(u=>{
let last=lastMsgs[u.id];
return `<div class="chatList" onclick="startChat('${u.id}')">
<div class="av">${u.pic?`<img src="${u.pic}">`:u.name.charAt(0)}</div>
<div style="flex:1"><b style="font-size:14px">${u.name}</b><div style="font-size:12px;color:#888">${last? (last.text||'📷 Photo') : 'Say Hi! Start chat - No robot'} • ${last? last.time : ''}</div></div>
<div style="width:8px;height:8px;background:#4CAF50;border-radius:50%"></div>
</div>`;
}).join('');
}
function backToChats(){tab('chats');renderChatList();}

function renderMessages(){
if(!currentChatId)return;
let conv=msgs.filter(m=>(m.from===cur.id && m.to===currentChatId) || (m.from===currentChatId && m.to===cur.id));
let h='';
conv.forEach(m=>{
let me=m.from===cur.id;
let pic=m.pic?`<img src="${m.pic}">`:'';
h+=`<div class="bubbleWrap"><div class="bubble ${me?'me':'other'}">${m.text?m.text:''}${pic}<div class="time">${m.time||''} ${me?'✓✓':''}</div></div></div>`;
});
document.getElementById('ch').innerHTML=h||'<p style="text-align:center;color:#BCAAA4;font-size:11px;margin-top:20px">No messages yet. Say Hi! 💛<br>Real chat - No robot</p>';
document.getElementById('ch').scrollTop=99999;
}
function sendMsg(){
let t=msg.value.trim();if(!t||!currentChatId)return;
msg.value='';
let m={from:cur.id,to:currentChatId,text:t,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),ts:Date.now()};
msgs.push(m);localStorage.setItem('lagos_real_msgs',JSON.stringify(msgs));
renderMessages();renderChatList();
}
function sendPic(i){
let f=i.files[0];if(!f||!currentChatId)return;
let r=new FileReader();r.onload=e=>{
let m={from:cur.id,to:currentChatId,text:'',pic:e.target.result,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),ts:Date.now()};
msgs.push(m);localStorage.setItem('lagos_real_msgs',JSON.stringify(msgs));renderMessages();renderChatList();
};r.readAsDataURL(f);
}
function renderMyProfile(){
document.getElementById('myProfile').innerHTML=`
<div class="profileHead">
<div class="profilePic">${cur.pic?`<img src="${cur.pic}">`:cur.name.charAt(0)}</div>
<h2 style="margin-top:10px;color:#222">${cur.name}, ${cur.age}</h2>
<p style="color:#2E7D32;font-size:12px">📍 ${cur.area} • ${cur.gender} • <span style="color:#4CAF50">● Online</span></p>
<p style="font-size:12px;color:#666;margin-top:6px">${cur.bio||''}</p>
<p style="font-size:11px;color:#BCAAA4;margin-top:6px">${cur.email}</p>
</div>
<div style="padding:14px">
<div class="card">
<b style="font-size:12px;color:#2E7D32">EDIT PROFILE</b>
<input id="en" value="${cur.name}" placeholder="Name">
<input id="eage" type="number" value="${cur.age}" placeholder="Age">
<select id="earea"><option ${cur.area==='Lekki'?'selected':''}>Lekki</option><option ${cur.area==='Ikeja'?'selected':''}>Ikeja</option><option ${cur.area==='Yaba'?'selected':''}>Yaba</option><option ${cur.area==='Surulere'?'selected':''}>Surulere</option><option ${cur.area==='VI'?'selected':''}>VI</option><option ${cur.area==='Ajah'?'selected':''}>Ajah</option><option ${cur.area==='Oshodi'?'selected':''}>Oshodi</option></select>
<textarea id="ebio" rows="2" placeholder="Bio">${cur.bio||''}</textarea>
<input type="file" id="efile" accept="image/*" onchange="updatePic(this)">
<button class="btn" onclick="saveProfile()">SAVE PROFILE 💚</button>
</div>
<div class="card" style="border:2px dashed #FFD54F;text-align:center">
<b style="color:#2E7D32;font-size:12px">ADD MORE PEOPLE - REAL ONLY</b>
<p style="font-size:11px;color:#795548;margin:6px 0">Share link make friends sign up. Na only people wey sign up go show for Discover!</p>
<p style="font-size:10px;color:#2E7D32;word-break:break-all;background:#FFF8E1;padding:6px;border-radius:8px">${location.href}</p>
<button class="btn-yellow btn" onclick="navigator.clipboard.writeText(location.href);alert('Link copied! Send for WhatsApp!')">COPY LINK 🔗</button>
<p style="font-size:10px;color:#999;margin-top:8px">Total Real Users: ${users.length} • No Robot 🚫🤖</p>
</div>
<button class="btn" style="background:#fff;color:#C62828;border:1.5px solid #FFCDD2" onclick="logout()">LOGOUT</button>
</div>
`;
}
function updatePic(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{cur.pic=e.target.result;document.querySelector('.profilePic').innerHTML=`<img src="${cur.pic}">`;};r.readAsDataURL(f);}
function saveProfile(){
cur.name=document.getElementById('en').value.trim()||cur.name;
cur.age=document.getElementById('eage').value||cur.age;
cur.area=document.getElementById('earea').value||cur.area;
cur.bio=document.getElementById('ebio').value.trim()||cur.bio;
let idx=users.findIndex(u=>u.id===cur.id);if(idx>=0)users[idx]=cur;
localStorage.setItem('lagos_real_users',JSON.stringify(users));
localStorage.setItem('lagos_cur',JSON.stringify(cur));
alert('Profile saved! 💚');renderMyProfile();renderDiscover();topInfo.textContent=cur.name+' • '+cur.area;
}
function logout(){if(confirm('Logout?')){localStorage.removeItem('lagos_cur');location.reload();}}
document.getElementById('msg')?.addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg()});
if(cur){auth.style.display='none';main.style.display='flex';topInfo.textContent=cur.name+' • '+cur.area;renderDiscover();renderChatList();renderMyProfile();}
</script></body></html>
